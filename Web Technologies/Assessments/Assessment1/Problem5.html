<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Apply Background</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

</head>
<body>

    <script>
        $(function () {
            $("div > h1").css("background-color", "yellow");
        });
    </script>

    <div>
        <h1>Heading 1 inside div</h1>
        <h1>Heading 2 inside div</h1>
    </div>

    <h1>Heading outside div </h1>
</body>
</html>
