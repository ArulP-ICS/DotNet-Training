<!-- 3. Write a JavaScript program to determine whether a given year is a leap year -->
<body>
    <p id="result"></p>
    <script>
        var year = 2024;

        if ((year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0)) {
            document.getElementById("result").innerHTML =
                year + " is a Leap Year";
        } else {
            document.getElementById("result").innerHTML =
                year + " is NOT a Leap Year";
        }
    </script>


</body>
</html>
