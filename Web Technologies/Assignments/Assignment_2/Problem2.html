<!-- 2. Write a JavaScript program to construct the following pattern, using a nested for loop.

*
* *
* * *
* * * *
* * * * * -->
<body>
    <p id="pattern"></p>
    <script>
        let output = "";

        for (let i = 1; i <= 5; i++) {
            for (let j = 1; j <= i; j++) {
                output += "* ";
            }
            output += "\n";
        }

        document.getElementById("pattern").innerText = output;

    </script>
</body>
</html>
