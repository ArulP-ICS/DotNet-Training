<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Triangle Area</title>
</head>

<!-- 1. Write a JavaScript program to find the area of a triangle where three sides are 5, 6, 7.-->
<body>

    <p id="demo"></p>

    <script>
        function myfunc() {
            var a = 5;
            var b = 6;
            var c = 7;

            var s = (a + b + c) / 2;
            var area = Math.sqrt(s * (s - a) * (s - b) * (s - c));

            document.getElementById("demo").innerHTML =
                "Area of the triangle is: " + area;
        }
        myfunc();
    </script>

</body>
</html>
